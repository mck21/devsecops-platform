name: Terraform

on:
  push:
    branches: ['**']
    paths:
      - 'infrastructure/**'
  pull_request:
    paths:
      - 'infrastructure/**'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    defaults:
      run:
        working-directory: infrastructure/environments/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            infrastructure/environments/${{ matrix.environment }}/.terraform
            infrastructure/environments/${{ matrix.environment }}/.terraform.lock.hcl
          key: terraform-${{ matrix.environment }}-${{ hashFiles(format('infrastructure/environments/{0}/.terraform.lock.hcl', matrix.environment), 'infrastructure/modules/**/*.tf') }}
          restore-keys: |
            terraform-${{ matrix.environment }}-

      - name: Terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ matrix.environment }}-cicd-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Save plan output
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infrastructure/environments/${{ matrix.environment }}/tfplan
            infrastructure/environments/${{ matrix.environment }}/plan.txt
          retention-days: 7
