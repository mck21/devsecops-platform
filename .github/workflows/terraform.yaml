name: Terraform

on:
  push:
    branches: ['**']
    paths:
      - 'infrastructure/**'
  pull_request:
    paths:
      - 'infrastructure/**'

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    defaults:
      run:
        working-directory: infrastructure/environments/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: |
            infrastructure/environments/${{ matrix.environment }}/.terraform
            infrastructure/environments/${{ matrix.environment }}/.terraform.lock.hcl
          key: terraform-${{ matrix.environment }}-${{ hashFiles(format('infrastructure/environments/{0}/.terraform.lock.hcl', matrix.environment), 'infrastructure/modules/**/*.tf') }}
          restore-keys: |
            terraform-${{ matrix.environment }}-

      - name: Terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.PROJECT_NAME }}-${{ matrix.environment }}-cicd-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Save plan output
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infrastructure/environments/${{ matrix.environment }}/tfplan
            infrastructure/environments/${{ matrix.environment }}/plan.txt
          retention-days: 7
