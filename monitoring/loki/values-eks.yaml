# Loki (grafana/loki Helm chart, single-binary scalable) — staging/production.
# helm install loki grafana/loki -n monitoring -f monitoring/loki/values-eks.yaml
deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  storage:
    type: s3
    bucketNames:
      chunks: mck21-devsecops-loki-chunks
      ruler: mck21-devsecops-loki-ruler
    s3:
      region: us-east-1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h  # 7 days

backend:
  replicas: 2
read:
  replicas: 2
write:
  replicas: 2

# IRSA for S3 access (Terraform-provisioned role).
serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::125156866917:role/mck21-devsecops-loki
