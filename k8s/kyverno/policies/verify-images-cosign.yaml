apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures (Cosign)
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only allow backend images that carry a valid Cosign signature. The CI
      pipeline signs images keylessly (Sigstore/Fulcio OIDC) after pushing to
      ECR; this policy verifies the signature before the pod is admitted.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-backend-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - staging
                - production
      verifyImages:
        - imageReferences:
            - "125156866917.dkr.ecr.us-east-1.amazonaws.com/mck21-devsecops-*-backend:*"
          attestors:
            - count: 1
              entries:
                # Keyless verification: image signed via GitHub Actions OIDC.
                - keyless:
                    subject: "https://github.com/mck21/devsecops-platform/.github/workflows/ci.yaml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
