# Kyverno ClusterPolicies. (Phase 6)
# Requires Kyverno installed via Helm first — see k8s/kyverno/install-notes.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mck21/devsecops-platform.git
    targetRevision: main
    path: k8s/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: policy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
