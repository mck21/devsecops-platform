        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
---
# ---------- dev (default-deny only; CNI enforcement varies on Minikube) ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
