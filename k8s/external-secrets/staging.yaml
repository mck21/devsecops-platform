# External Secrets Operator — staging.
# Pulls backend credentials from AWS Secrets Manager into the `backend-secrets`
# Kubernetes Secret consumed by the deployment. Auth via IRSA (no static keys).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: staging
  annotations:
    # IRSA role created by Terraform (external-secrets module); read-only on the
    # mck21-devsecops/staging/* secret path.
    eks.amazonaws.com/role-arn: arn:aws:iam::125156866917:role/mck21-devsecops-staging-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: mck21-devsecops/staging/backend
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: mck21-devsecops/staging/backend
        property: REDIS_URL
