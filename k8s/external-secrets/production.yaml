# External Secrets Operator — production.
# Pulls backend credentials from AWS Secrets Manager into `backend-secrets`.
# Runtime is OFF during showcase; this is the Git mirror of the staging setup.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::125156866917:role/mck21-devsecops-production-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: mck21-devsecops/production/backend
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: mck21-devsecops/production/backend
        property: REDIS_URL
